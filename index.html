<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Star Tracker</title>
<style>
  :root {
    --ink: #17171a;
    --paper: #f6f2e8;
    --red: #e0362a;
    --red-dark: #a92318;
    --blue: #1d3f91;
    --blue-dark: #142a63;
    --yellow: #ffc839;
    --muted: #6b675c;
    --line: rgba(23,23,26,0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 14px 14px;
    min-height: 100vh;
    padding: 24px 14px 40px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 24px; }
  .kicker {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  h1 {
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -0.01em;
    color: var(--red);
    line-height: 1.1;
    margin: 0;
  }

  .panel {
    background: var(--paper);
    border: 2.5px solid var(--ink);
    border-radius: 6px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 20px;
    margin-bottom: 20px;
  }

  .star-panel { text-align: center; }
  .star-count {
    font-weight: 800;
    font-size: 64px;
    color: var(--blue);
    line-height: 1;
  }
  .star-count .icon { font-size: 42px; margin-left: 4px; }
  .star-caption {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  button {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 16px 6px;
    min-height: 52px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    touch-action: manipulation;
  }
  button:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  .add-btn { background: var(--red); color: #fff; }
  .remove-btn { background: var(--paper); color: var(--blue-dark); }

  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 10px 4px;
  }

  .reward {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1.5px dashed var(--line);
    gap: 10px;
  }
  .reward:last-child { border-bottom: none; }
  .reward-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .badge {
    min-width: 42px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    background: #fff;
    flex-shrink: 0;
  }
  .reward.unlocked .badge { background: var(--yellow); }
  .reward-name { font-size: 14.5px; font-weight: 600; }
  .reward-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .reward-sub.unlocked-text { color: var(--red-dark); font-weight: 600; }
  .star-req {
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 600;
    flex-shrink: 0;
  }
  .check { font-size: 18px; flex-shrink: 0; }

  .footer-note {
    text-align: center;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.5;
  }
  .sync-note {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  button:disabled { opacity: 0.55; cursor: default; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">issue no. 1 — the gym arc</div>
    <h1>Star Tracker</h1>
  </header>

  <div class="panel star-panel">
    <div class="star-count" id="starCount">0<span class="icon">★</span></div>
    <div class="star-caption">stars earned together</div>
    <div class="btn-row">
      <button class="add-btn" id="addBtn" type="button">Went to the gym +1</button>
      <button class="remove-btn" id="removeBtn" type="button">Skipped it −1</button>
    </div>
  </div>

  <div class="section-title">Rewards</div>
  <div class="panel" style="padding: 4px 18px;">
    <div id="rewardsList"></div>
  </div>

  <div class="sync-note" id="syncNote">Loading shared count…</div>
  <div class="footer-note">Shared between the two of you — anyone with this link can add or remove a star.</div>
</div>

<script>
const REWARDS = [
  { stars: 5, name: "Phonecase — Spiderman", icon: "📱" },
  { stars: 15, name: "Matching iPad casing", icon: "💻" },
  { stars: 25, name: "Owala — Spiderman", icon: "🥤" },
  { stars: 50, name: "Birkenstocks", icon: "👞" },
  { stars: 200, name: "DJI", icon: "🚁" }
];

// Shared public counter — this key acts like the "database" for this tracker.
// Anyone with this file/link who calls this key sees the same number.
const API_BASE = 'https://countapi.mileshilliard.com/api/v1';
const COUNTER_KEY = 'gymstar_couple_tracker_x7q2p9';

let stars = 0;
let busy = false;

function render() {
  document.getElementById('starCount').innerHTML = stars + '<span class="icon">★</span>';

  const rewardsEl = document.getElementById('rewardsList');
  rewardsEl.innerHTML = REWARDS.map(r => {
    const unlocked = stars >= r.stars;
    return '<div class="reward ' + (unlocked ? 'unlocked' : '') + '">' +
      '<div class="reward-left">' +
        '<div class="badge">' + r.icon + '</div>' +
        '<div>' +
          '<div class="reward-name">' + r.name + '</div>' +
          '<div class="reward-sub ' + (unlocked ? 'unlocked-text' : '') + '">' + (unlocked ? 'Unlocked' : (r.stars - stars) + ' more to go') + '</div>' +
        '</div>' +
      '</div>' +
      (unlocked ? '<span class="check">✔</span>' : '<span class="star-req">' + r.stars + ' ★</span>') +
    '</div>';
  }).join('');
}

function setButtonsDisabled(disabled) {
  document.getElementById('addBtn').disabled = disabled;
  document.getElementById('removeBtn').disabled = disabled;
}

function setNote(text) {
  document.getElementById('syncNote').textContent = text;
}

render();

async function fetchCount() {
  const res = await fetch(API_BASE + '/get/' + COUNTER_KEY);
  if (res.status === 404) {
    const initRes = await fetch(API_BASE + '/set/' + COUNTER_KEY + '?value=0');
    const initData = await initRes.json();
    return parseInt(initData.value, 10);
  }
  const data = await res.json();
  return parseInt(data.value, 10);
}

async function refresh(showNote) {
  try {
    stars = await fetchCount();
    render();
    if (showNote) setNote('Synced just now');
  } catch (e) {
    if (showNote) setNote("Couldn't sync — check your connection");
  }
}

document.getElementById('addBtn').addEventListener('click', async function() {
  if (busy) return;
  busy = true;
  setButtonsDisabled(true);
  setNote('Saving…');
  try {
    const res = await fetch(API_BASE + '/hit/' + COUNTER_KEY);
    const data = await res.json();
    stars = parseInt(data.value, 10);
    render();
    setNote('Synced just now');
  } catch (e) {
    setNote("Couldn't save — check your connection");
  }
  busy = false;
  setButtonsDisabled(false);
});

document.getElementById('removeBtn').addEventListener('click', async function() {
  if (busy) return;
  busy = true;
  setButtonsDisabled(true);
  setNote('Saving…');
  try {
    const current = await fetchCount();
    const next = Math.max(0, current - 1);
    const res = await fetch(API_BASE + '/set/' + COUNTER_KEY + '?value=' + next);
    const data = await res.json();
    stars = parseInt(data.value, 10);
    render();
    setNote('Synced just now');
  } catch (e) {
    setNote("Couldn't save — check your connection");
  }
  busy = false;
  setButtonsDisabled(false);
});

// Initial load, then keep in sync with whatever your partner does
refresh(true);
setInterval(function() { refresh(false); }, 5000);
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') refresh(true);
});
</script>
</body>
</html>
